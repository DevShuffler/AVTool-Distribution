
name: AVTool Access Control

on:
  workflow_dispatch:
  schedule:
    - cron: '17 4 * * *'

permissions:
  contents: read

concurrency:
  group: avtool-access-publisher
  cancel-in-progress: false

jobs:
  publish-access-token:
    name: Sign Verify and Publish
    runs-on: ubuntu-24.04

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          persist-credentials: true

      - name: Validate access switch
        env:
          AVTOOL_ACCESS_ENABLED: ${{ vars.AVTOOL_ACCESS_ENABLED }}
        shell: bash
        run: |
          if [[ "$AVTOOL_ACCESS_ENABLED" != "true" && "$AVTOOL_ACCESS_ENABLED" != "false" ]]; then
            echo "ERROR: Invalid access switch"
            exit 1
          fi

          echo "ACCESS SWITCH VERIFIED"

      - name: Verify ECDSA key pair
        env:
          AVTOOL_SIGNING_PRIVATE_KEY: ${{ secrets.AVTOOL_SIGNING_PRIVATE_KEY }}
        run: python3 tools/sign-test.py

      - name: Generate signed access token
        env:
          AVTOOL_SIGNING_PRIVATE_KEY: ${{ secrets.AVTOOL_SIGNING_PRIVATE_KEY }}
          AVTOOL_ACCESS_ENABLED: ${{ vars.AVTOOL_ACCESS_ENABLED }}
        run: python3 tools/generate-access-token.py

      - name: Verify signed token
        env:
          EXPECTED_ACCESS: ${{ vars.AVTOOL_ACCESS_ENABLED }}
        shell: bash
        run: |
          python3 - <<'PY'
          import base64
          import json
          import os
          import subprocess
          import tempfile
          from pathlib import Path
          from datetime import datetime, timedelta, timezone

          token = json.loads(
              Path("access-token.json").read_text(encoding="utf-8")
          )

          payload = base64.b64decode(
              token["payload"], validate=True
          )

          signature = base64.b64decode(
              token["signature"], validate=True
          )

          with tempfile.TemporaryDirectory() as directory:
              message_path = Path(directory) / "payload.bin"
              signature_path = Path(directory) / "signature.bin"

              message_path.write_bytes(payload)
              signature_path.write_bytes(signature)

              result = subprocess.run(
                  [
                      "openssl", "dgst", "-sha256",
                      "-verify", "avtool-signing-public.pem",
                      "-signature", str(signature_path),
                      str(message_path)
                  ],
                  capture_output=True,
                  text=True
              )

              if result.returncode != 0:
                  raise RuntimeError("Invalid digital signature")

          data = json.loads(payload)

          if data["schemaVersion"] != 1:
              raise RuntimeError("Invalid schema version")

          if data["product"] != "AVTool":
              raise RuntimeError("Invalid product")

          if type(data["enabled"]) is not bool:
              raise RuntimeError("Invalid enabled type")

          expected = os.environ["EXPECTED_ACCESS"] == "true"

          if data["enabled"] != expected:
              raise RuntimeError("Access switch mismatch")

          issued = datetime.fromisoformat(
              data["issuedAtUtc"].replace("Z", "+00:00")
          )

          expires = datetime.fromisoformat(
              data["expiresAtUtc"].replace("Z", "+00:00")
          )

          now = datetime.now(timezone.utc)

          if expires - issued != timedelta(hours=168):
              raise RuntimeError("Invalid validity period")

          if issued > now + timedelta(minutes=5):
              raise RuntimeError("Future issue timestamp")

          if expires <= now:
              raise RuntimeError("Expired token")

          print("TOKEN SIGNATURE VERIFIED")
          print("ACCESS VALUE VERIFIED:", expected)
          print("VALIDITY VERIFIED: 168 HOURS")
          print("TOKEN READY FOR PUBLICATION")
          PY

      - name: Publish signed token
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -- access-token.json

          if git diff --cached --quiet; then
            echo "Token unchanged"
            exit 0
          fi

          git commit -m "AVTool: refresh signed access token"

          git push origin HEAD:main

          echo "SIGNED ACCESS TOKEN PUBLISHED"
