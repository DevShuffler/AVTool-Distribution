
name: AVTool Access Control

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sign-access-token:
    name: Verify AVTool ECDSA Signing
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify access variable
        env:
          AVTOOL_ACCESS_ENABLED: ${{ vars.AVTOOL_ACCESS_ENABLED }}
        shell: bash
        run: |
          if [ "$AVTOOL_ACCESS_ENABLED" != "true" ] && [ "$AVTOOL_ACCESS_ENABLED" != "false" ]; then
            echo "Invalid access variable"
            exit 1
          fi
          echo "ACCESS VARIABLE VERIFIED"

      - name: Verify ECDSA signing keys
        env:
          AVTOOL_SIGNING_PRIVATE_KEY: ${{ secrets.AVTOOL_SIGNING_PRIVATE_KEY }}
        shell: bash
        run: |
          python3 tools/sign-test.py

      - name: Verification summary
        shell: bash
        run: |
          echo "AVTool ECDSA signing verification completed"
          echo "No access token was published"
