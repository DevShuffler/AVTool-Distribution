
name: AVTool Access Control

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sign-access-token:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Verify access variable
        env:
          AVTOOL_ACCESS_ENABLED: ${{ vars.AVTOOL_ACCESS_ENABLED }}
        run: |
          if [ "$AVTOOL_ACCESS_ENABLED" != "true" ] && [ "$AVTOOL_ACCESS_ENABLED" != "false" ]; then
            echo "Invalid access variable"
            exit 1
          fi
          echo "Access configuration valid"

      - name: Verify signing secret exists
        env:
          AVTOOL_SIGNING_PRIVATE_KEY: ${{ secrets.AVTOOL_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -z "$AVTOOL_SIGNING_PRIVATE_KEY" ]; then
            echo "Signing secret is missing"
            exit 1
          fi
          echo "Signing secret is configured"

      - name: Check environment
        run: |
          dotnet --version
          echo "AVTool signing environment ready"
