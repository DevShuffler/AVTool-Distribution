
name: AVTool Release Signing

on:
  workflow_dispatch:
    inputs:
      build_run_id:
        description: "Successful AVTool Build run ID"
        required: true
        default: "42038003416"
        type: string
      version:
        description: "AVTool version"
        required: true
        default: "1.0.1"
        type: string

permissions:
  contents: read

concurrency:
  group: avtool-release-signing
  cancel-in-progress: false

jobs:
  sign-release:
    name: Download Verify and Sign Release
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    env:
      AVTOOL_VERSION: ${{ inputs.version }}
      AVTOOL_BUILD_RUN_ID: ${{ inputs.build_run_id }}

    steps:
      - name: Checkout distribution repository
        uses: actions/checkout@v4

      - name: Validate input and Python syntax
        shell: bash
        run: |
          set -euo pipefail

          [[ "$AVTOOL_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$AVTOOL_BUILD_RUN_ID" =~ ^[0-9]+$ ]]

          python3 -m py_compile tools/sign-release.py
          python3 -m py_compile tools/sign-test.py

          test -s avtool-signing-public.pem

          echo "INPUT AND PYTHON VERIFIED"

      - name: Download and verify AVTool build
        shell: bash
        env:
          AVTOOL_BUILD_ARTIFACT_TOKEN: ${{ secrets.AVTOOL_BUILD_ARTIFACT_TOKEN }}
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import hashlib
          import io
          import json
          import os
          import re
          import urllib.error
          import urllib.parse
          import urllib.request
          import zipfile

          from pathlib import Path

          token = os.environ.get(
              "AVTOOL_BUILD_ARTIFACT_TOKEN", ""
          ).strip()

          run_id = os.environ["AVTOOL_BUILD_RUN_ID"]
          version = os.environ["AVTOOL_VERSION"]

          if not token:
              raise RuntimeError(
                  "AVTOOL_BUILD_ARTIFACT_TOKEN is missing"
              )

          if not re.fullmatch(r"[0-9]+", run_id):
              raise RuntimeError("Invalid build run ID")

          if not re.fullmatch(
              r"[0-9]+\.[0-9]+\.[0-9]+",
              version
          ):
              raise RuntimeError("Invalid version")

          api_base = "https://api.github.com"
          repository = "DevShuffler/AVTool"

          artifact_name = (
              f"AVTool-Distribution-{version}"
          )

          package_name = f"AVTool-{version}.zip"
          checksum_name = package_name + ".sha256"
          setup_name = "AVTool.Setup.exe"

          headers = {
              "Authorization": f"Bearer {token}",
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "AVTool-Release-Signing",
          }

          class NoRedirect(
              urllib.request.HTTPRedirectHandler
          ):
              def redirect_request(
                  self,
                  req,
                  fp,
                  code,
                  msg,
                  response_headers,
                  newurl
              ):
                  return None

          api_opener = urllib.request.build_opener(
              NoRedirect()
          )

          def api_get_json(url):
              request = urllib.request.Request(
                  url,
                  headers=headers
              )

              try:
                  with urllib.request.urlopen(
                      request,
                      timeout=60
                  ) as response:
                      return json.loads(
                          response.read()
                      )

              except urllib.error.HTTPError as error:
                  host = urllib.parse.urlsplit(
                      error.url
                  ).hostname

                  raise RuntimeError(
                      f"GitHub API failed: "
                      f"HTTP {error.code}, "
                      f"host={host}"
                  ) from error

          def download_artifact(url):
              request = urllib.request.Request(
                  url,
                  headers=headers
              )

              try:
                  api_opener.open(
                      request,
                      timeout=60
                  )

              except urllib.error.HTTPError as error:
                  if error.code not in (
                      301, 302, 303, 307, 308
                  ):
                      host = urllib.parse.urlsplit(
                          error.url
                      ).hostname

                      raise RuntimeError(
                          f"Artifact API request failed: "
                          f"HTTP {error.code}, "
                          f"host={host}"
                      ) from error

                  location = error.headers.get(
                      "Location"
                  )

                  if not location:
                      raise RuntimeError(
                          "Artifact redirect has no Location"
                      )

              else:
                  raise RuntimeError(
                      "Expected GitHub artifact redirect"
                  )

              redirect_url = urllib.parse.urljoin(
                  url,
                  location
              )

              parsed = urllib.parse.urlsplit(
                  redirect_url
              )

              if parsed.scheme != "https":
                  raise RuntimeError(
                      "Artifact redirect must use HTTPS"
                  )

              if not parsed.hostname:
                  raise RuntimeError(
                      "Artifact redirect host is missing"
                  )

              print(
                  "ARTIFACT STORAGE HOST:",
                  parsed.hostname
              )

              storage_request = urllib.request.Request(
                  redirect_url,
                  headers={
                      "User-Agent": "AVTool-Release-Signing"
                  }
              )

              try:
                  with urllib.request.urlopen(
                      storage_request,
                      timeout=120
                  ) as response:
                      content = response.read()

              except urllib.error.HTTPError as error:
                  host = urllib.parse.urlsplit(
                      error.url
                  ).hostname

                  raise RuntimeError(
                      f"Artifact storage download failed: "
                      f"HTTP {error.code}, "
                      f"host={host}"
                  ) from error

              if not content:
                  raise RuntimeError(
                      "Downloaded artifact is empty"
                  )

              return content

          print("SOURCE REPOSITORY:", repository)
          print("SOURCE RUN ID:", run_id)
          print("EXPECTED ARTIFACT:", artifact_name)

          # 1. Verify the GitHub Actions run.

          run_url = (
              f"{api_base}/repos/{repository}"
              f"/actions/runs/{run_id}"
          )

          run = api_get_json(run_url)

          if (
              run.get("repository", {}).get("full_name")
              != repository
          ):
              raise RuntimeError(
                  "Unexpected source repository"
              )

          if run.get("status") != "completed":
              raise RuntimeError(
                  "Source build is not completed"
              )

          if run.get("conclusion") != "success":
              raise RuntimeError(
                  "Source build was not successful"
              )

          if run.get("event") != "workflow_dispatch":
              raise RuntimeError(
                  "Unexpected source build event"
              )

          expected_branch = (
              "recovery/unified-schedule-20261030"
          )

          if run.get("head_branch") != expected_branch:
              raise RuntimeError(
                  "Unexpected source branch"
              )

          workflow_path = (
              run.get("path", "").split("@")[0]
          )

          if workflow_path != (
              ".github/workflows/build-avtool.yml"
          ):
              raise RuntimeError(
                  "Unexpected source workflow"
              )

          print(
              "SOURCE COMMIT:",
              run.get("head_sha")
          )

          # 2. Find matching artifact.

          artifacts_url = (
              f"{api_base}/repos/{repository}"
              f"/actions/runs/{run_id}"
              f"/artifacts?per_page=100"
          )

          result = api_get_json(artifacts_url)

          artifacts = result.get("artifacts", [])

          matches = [
              artifact
              for artifact in artifacts
              if artifact.get("name") == artifact_name
              and not artifact.get("expired", True)
          ]

          if len(matches) != 1:
              raise RuntimeError(
                  f"Expected one artifact "
                  f"'{artifact_name}', "
                  f"found {len(matches)}"
              )

          artifact = matches[0]

          print(
              "SOURCE ARTIFACT ID:",
              artifact["id"]
          )

          # 3. Download artifact archive.

          archive_url = (
              f"{api_base}/repos/{repository}"
              f"/actions/artifacts/{artifact['id']}/zip"
          )

          archive_bytes = download_artifact(
              archive_url
          )

          print(
              "ARTIFACT ARCHIVE DOWNLOADED:",
              len(archive_bytes),
              "bytes"
          )

          # 4. Validate outer artifact archive.

          expected_files = {
              package_name,
              checksum_name,
              setup_name,
          }

          output = Path("dist")
          output.mkdir(exist_ok=True)

          with zipfile.ZipFile(
              io.BytesIO(archive_bytes)
          ) as archive:

              entries = archive.infolist()

              names = [
                  entry.filename
                  for entry in entries
              ]

              if (
                  len(names) != len(expected_files)
                  or set(names) != expected_files
              ):
                  raise RuntimeError(
                      "Unexpected artifact contents: "
                      + repr(names)
                  )

              for entry in entries:
                  name = entry.filename

                  if entry.is_dir():
                      raise RuntimeError(
                          "Unexpected directory"
                      )

                  if (
                      entry.file_size <= 0
                      or entry.file_size > 100_000_000
                  ):
                      raise RuntimeError(
                          f"Invalid file size: {name}"
                      )

                  data = archive.read(entry)

                  if len(data) != entry.file_size:
                      raise RuntimeError(
                          f"Invalid extracted file: {name}"
                      )

                  (output / name).write_bytes(data)

          print("ARTIFACT FILE STRUCTURE VERIFIED")

          # 5. Verify SHA256.

          package_path = output / package_name

          package_hash = hashlib.sha256(
              package_path.read_bytes()
          ).hexdigest().upper()

          checksum_text = (
              (output / checksum_name)
              .read_text(encoding="ascii")
              .strip()
          )

          expected_checksum = (
              f"{package_hash}  {package_name}"
          )

          if (
              checksum_text.upper()
              != expected_checksum.upper()
          ):
              raise RuntimeError(
                  "SHA256 checksum mismatch"
              )

          print("PACKAGE SHA256 VERIFIED")
          print("SHA256:", package_hash)

          # 6. Verify inner AVTool ZIP.
          # Normalize Windows and Unix separators.

          required_dlls = {
              "AVTool.Core.dll",
              "AVTool.Contracts.dll",
              "AVTool.Core.deps.json",
              "System.Security.Cryptography.ProtectedData.dll",
              "Modules/VK/AVTool.Modules.VK.dll",
          }

          with zipfile.ZipFile(
              package_path
          ) as package_zip:

              actual_files = set()

              for entry in package_zip.infolist():
                  normalized_name = (
                      entry.filename.replace("\\", "/")
                  )

                  if normalized_name.startswith("/"):
                      raise RuntimeError(
                          "Invalid absolute ZIP path"
                      )

                  components = normalized_name.split("/")

                  if ".." in components:
                      raise RuntimeError(
                          "Invalid ZIP path traversal"
                      )

                  if normalized_name in actual_files:
                      raise RuntimeError(
                          "Duplicate ZIP entry"
                      )

                  actual_files.add(normalized_name)

              missing = required_dlls - actual_files

              if missing:
                  raise RuntimeError(
                      "Missing AVTool files: "
                      + repr(sorted(missing))
                      + "; actual files: "
                      + repr(sorted(actual_files))
                  )

          print("AVTOOL PACKAGE VERIFIED")
          print("BUILD ARTIFACT VERIFIED")
          PY

      - name: Verify ECDSA signing key
        shell: bash
        env:
          AVTOOL_SIGNING_PRIVATE_KEY: ${{ secrets.AVTOOL_SIGNING_PRIVATE_KEY }}
        run: |
          set -euo pipefail

          python3 tools/sign-test.py

          echo "ECDSA SIGNING KEY VERIFIED"

      - name: Sign AVTool release
        shell: bash
        env:
          AVTOOL_SIGNING_PRIVATE_KEY: ${{ secrets.AVTOOL_SIGNING_PRIVATE_KEY }}
        run: |
          set -euo pipefail

          python3 tools/sign-release.py

          echo "RELEASE MANIFEST CREATED"

      - name: Verify signed release manifest
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import base64
          import hashlib
          import json
          import os
          import subprocess
          import tempfile

          from pathlib import Path

          version = os.environ["AVTOOL_VERSION"]
          package_name = f"AVTool-{version}.zip"

          package_path = (
              Path("dist") / package_name
          )

          manifest_path = (
              Path("dist")
              / (package_name + ".release.json")
          )

          manifest = json.loads(
              manifest_path.read_text(
                  encoding="utf-8"
              )
          )

          if set(manifest.keys()) != {
              "payload",
              "signature"
          }:
              raise RuntimeError(
                  "Unexpected manifest structure"
              )

          payload_bytes = base64.b64decode(
              manifest["payload"],
              validate=True
          )

          signature_bytes = base64.b64decode(
              manifest["signature"],
              validate=True
          )

          # Verify ECDSA SHA256 DER signature.

          with tempfile.TemporaryDirectory() as directory:
              temp = Path(directory)

              payload_file = (
                  temp / "payload.bin"
              )

              signature_file = (
                  temp / "signature.der"
              )

              payload_file.write_bytes(
                  payload_bytes
              )

              signature_file.write_bytes(
                  signature_bytes
              )

              subprocess.run(
                  [
                      "openssl",
                      "dgst",
                      "-sha256",
                      "-verify",
                      "avtool-signing-public.pem",
                      "-signature",
                      str(signature_file),
                      str(payload_file),
                  ],
                  check=True
              )

          payload = json.loads(
              payload_bytes
          )

          if payload.get("schemaVersion") != 1:
              raise RuntimeError(
                  "Invalid manifest schema"
              )

          if payload.get("product") != "AVTool":
              raise RuntimeError(
                  "Invalid manifest product"
              )

          if payload.get("version") != version:
              raise RuntimeError(
                  "Manifest version mismatch"
              )

          if (
              payload.get("packageFile")
              != package_name
          ):
              raise RuntimeError(
                  "Manifest package filename mismatch"
              )

          actual_hash = hashlib.sha256(
              package_path.read_bytes()
          ).hexdigest()

          signed_hash = payload.get(
              "sha256", ""
          )

          if not isinstance(
              signed_hash,
              str
          ):
              raise RuntimeError(
                  "Invalid signed hash"
              )

          if signed_hash.lower() != actual_hash:
              raise RuntimeError(
                  "Signed SHA256 mismatch"
              )

          print("ECDSA RELEASE SIGNATURE VERIFIED")
          print("SIGNED PACKAGE SHA256 VERIFIED")
          PY

      - name: Verify final release files
        shell: bash
        run: |
          set -euo pipefail

          test -s "dist/AVTool-${AVTOOL_VERSION}.zip"
          test -s "dist/AVTool-${AVTOOL_VERSION}.zip.sha256"
          test -s "dist/AVTool-${AVTOOL_VERSION}.zip.release.json"
          test -s "dist/AVTool.Setup.exe"

          echo "SIGNED RELEASE PACKAGE READY"

      - name: Upload signed release artifact
        uses: actions/upload-artifact@v4
        with:
          name: AVTool-Signed-${{ inputs.version }}
          path: dist/
          if-no-files-found: error
          retention-days: 14
